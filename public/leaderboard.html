<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gorz Reborn — Commander Leaderboard</title>
  <meta name="description" content="Live leaderboard of Gorz Reborn commanders — ranking, tactics and army composition." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* ==================== leaderboard-specific styles ==================== */
    .lb-shell { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
    .lb-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .lb-title { font-size: 28px; font-weight: 700; color: var(--text); margin: 0; letter-spacing: -0.5px; }
    .lb-title .ember { color: var(--accent-strong); }
    .lb-subtitle { color: var(--text-dim); font-size: 14px; margin: 4px 0 0; }
    .lb-controls { display: flex; align-items: center; gap: 10px; }
    .lb-select { background: var(--bg-panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 14px; cursor: pointer; }
    .lb-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .lb-btn { background: var(--bg-panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 14px; cursor: pointer; transition: all 0.15s; }
    .lb-btn:hover { background: var(--bg-hover); border-color: var(--accent-line); }
    .lb-btn.primary { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-strong); }
    .lb-btn.primary:hover { background: var(--accent-line); }
    .lb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .lb-stat { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
    .lb-stat-label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .lb-stat-value { color: var(--text); font-size: 24px; font-weight: 700; }
    .lb-stat-value.accent { color: var(--accent-strong); }
    .lb-table-wrap { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .lb-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .lb-table th { background: var(--bg-deep); color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line); }
    .lb-table td { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); color: var(--text); vertical-align: middle; }
    .lb-table tr:last-child td { border-bottom: none; }
    .lb-table tr.lb-row { cursor: pointer; transition: background 0.12s; }
    .lb-table tr.lb-row:hover { background: var(--bg-hover); }
    .lb-rank { font-weight: 700; color: var(--text-faint); width: 50px; font-variant-numeric: tabular-nums; }
    .lb-rank.top1 { color: var(--accent-strong); font-size: 18px; }
    .lb-rank.top3 { color: var(--accent); }
    .lb-id { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 13px; color: var(--text-dim); }
    .lb-gen { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--bg-deep); color: var(--text-dim); font-size: 11px; font-weight: 600; }
    .lb-fitness { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .lb-fitness .delta-good { color: var(--good); font-size: 11px; margin-left: 4px; }
    .lb-wld { font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: 13px; }
    .lb-wld .w { color: var(--good); }
    .lb-wld .l { color: var(--bad); }
    .lb-wld .d { color: var(--warn); }
    .lb-comp { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--bg-deep); border: 1px solid var(--line-soft); width: 120px; }
    .lb-comp .seg { height: 100%; }
    .lb-comp .seg.s { background: #7fb2e5; }  /* swordsman = info blue */
    .lb-comp .seg.a { background: #6fcf97; }  /* archer = good green */
    .lb-comp .seg.c { background: #e8c15a; }  /* cavalry = warn amber */
    .lb-comp-label { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; margin-top: 3px; }
    .lb-tactics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 10px; min-width: 140px; }
    .lb-tac { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .lb-tac-label { color: var(--text-faint); min-width: 32px; }
    .lb-tac-bar { flex: 1; height: 4px; background: var(--bg-deep); border-radius: 2px; overflow: hidden; }
    .lb-tac-bar .fill { display: block; height: 100%; background: var(--accent); }
    .lb-tac-val { color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
    .lb-target { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--bg-deep); color: var(--text-dim); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
    .lb-empty { padding: 60px 20px; text-align: center; color: var(--text-dim); }
    .lb-empty .emoji { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

    /* ==================== detail panel ==================== */
    .lb-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 50; }
    .lb-overlay.open { display: block; }
    .lb-panel { position: fixed; top: 0; bottom: 0; right: 0; width: 480px; max-width: 100vw; background: var(--bg); border-left: 1px solid var(--line); overflow-y: auto; transform: translateX(100%); transition: transform 0.2s; z-index: 51; padding: 24px; box-sizing: border-box; }
    .lb-panel.open { transform: translateX(0); }
    .lb-panel h2 { font-size: 20px; color: var(--text); margin: 0 0 8px; }
    .lb-panel .meta { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
    .lb-section { margin: 20px 0; padding: 16px; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px; }
    .lb-section h3 { color: var(--accent-strong); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 12px; }
    .lb-kv { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .lb-kv .k { color: var(--text-dim); }
    .lb-kv .v { color: var(--text); font-family: 'JetBrains Mono', monospace; }
    .lb-fp { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); word-break: break-all; padding: 10px; background: var(--bg-deep); border-radius: 6px; line-height: 1.5; }
    .lb-close { position: absolute; top: 16px; right: 16px; background: var(--bg-panel); color: var(--text-dim); border: 1px solid var(--line); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .lb-close:hover { color: var(--text); border-color: var(--accent-line); }

    .lb-loading { text-align: center; padding: 40px; color: var(--text-dim); }
    .lb-loading::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    .lb-tick { color: var(--text-faint); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
    .lb-pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <main class="lb-shell">
    <header class="lb-header">
      <div>
        <h1 class="lb-title">🏆 Commander <span class="ember">Leaderboard</span></h1>
        <p class="lb-subtitle">Live ranking of Gorz Reborn agents — self-evolving via the Elo algorithm.</p>
      </div>
      <div class="lb-controls">
        <select id="lineage-select" class="lb-select" aria-label="Select lineage">
          <option value="">All lineages</option>
        </select>
        <button id="refresh-btn" class="lb-btn primary" type="button">↻ Refresh</button>
      </div>
    </header>

    <section class="lb-stats" id="stats-grid">
      <div class="lb-stat"><div class="lb-stat-label">Selected lineage</div><div class="lb-stat-value" id="stat-lineage">—</div></div>
      <div class="lb-stat"><div class="lb-stat-label">Agent count</div><div class="lb-stat-value accent" id="stat-count">—</div></div>
      <div class="lb-stat"><div class="lb-stat-label">Average fitness</div><div class="lb-stat-value" id="stat-avg">—</div></div>
      <div class="lb-stat"><div class="lb-stat-label">Highest generation</div><div class="lb-stat-value" id="stat-gen">—</div></div>
    </section>

    <div class="lb-table-wrap">
      <table class="lb-table" id="lb-table">
        <thead>
          <tr>
            <th>#</th>
            <th>ID</th>
            <th>Gen</th>
            <th>Fitness</th>
            <th>Win/Loss/Draw</th>
            <th>Army composition</th>
            <th>Tactics</th>
            <th>Target</th>
          </tr>
        </thead>
        <tbody id="lb-tbody">
          <tr><td colspan="8" class="lb-loading">Loading</td></tr>
        </tbody>
      </table>
    </div>

    <p class="lb-tick" id="last-tick" style="margin-top:12px; text-align:end;">
      <span class="lb-pulse"></span> Live — every 10 seconds
    </p>
  </main>

  <div class="lb-overlay" id="overlay"></div>
  <aside class="lb-panel" id="detail-panel">
    <button class="lb-close" id="close-btn" type="button" aria-label="Close">✕</button>
    <div id="detail-body">
      <div class="lb-loading">Loading</div>
    </div>
  </aside>

  <script>
  (function () {
    'use strict';
    const API = '';  // same origin
    const REFRESH_MS = 10000;
    const selected = { lineage: '' };

    // ------------- helpers -------------
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));
    const fmt = (n, d = 0) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: d });
    const pct = (n) => Math.round(Number(n || 0) * 100);

    // Persist + restore lineage selection across reloads.
    const LS_KEY = 'gorz.lb.lineage';
    try { selected.lineage = localStorage.getItem(LS_KEY) || ''; } catch (_) {}

    function setLineage(name) {
      selected.lineage = name || '';
      try { localStorage.setItem(LS_KEY, selected.lineage); } catch (_) {}
      load();
    }

    // ------------- fetchers -------------
    async function fetchJSON(path) {
      const r = await fetch(API + path, { headers: { 'Accept': 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    async function loadLineages() {
      try {
        const data = await fetchJSON('/api/agent/lineages');
        const sel = $('#lineage-select');
        const prev = selected.lineage;
        // rebuild options
        const opts = ['<option value="">All lineages</option>'];
        for (const l of (data.lineages || [])) {
          opts.push(`<option value="${l.lineage}">${l.lineage} — ${l.n} agents, avg ${fmt(l.avg_fitness)}</option>`);
        }
        sel.innerHTML = opts.join('');
        if (prev && (data.lineages || []).some(l => l.lineage === prev)) {
          sel.value = prev;
          selected.lineage = prev;
        }
      } catch (e) {
        console.error('loadLineages failed:', e);
      }
    }

    async function loadPopulation(lineage) {
      // Fetch a large page; UI only renders the top 50 by fitness.
      const path = lineage
        ? '/api/agent/population?lineage=' + encodeURIComponent(lineage) + '&limit=500'
        : '/api/agent/population?limit=500';
      const data = await fetchJSON(path);
      return (data.agents || []).slice().sort((a, b) => (b.fitness || 0) - (a.fitness || 0));
    }

    async function loadLineageStats(lineage) {
      const data = await fetchJSON('/api/agent/lineages');
      const match = (data.lineages || []).find(l => l.lineage === lineage);
      return match || null;
    }

    // ------------- render -------------
    function renderComposition(comp) {
      const s = Math.round((comp.swordsman || 0) * 100);
      const a = Math.round((comp.archer || 0) * 100);
      const c = Math.round((comp.cavalry || 0) * 100);
      return `
        <div>
          <div class="lb-comp" aria-label="Army composition">
            <div class="seg s" style="width:${s}%"></div>
            <div class="seg a" style="width:${a}%"></div>
            <div class="seg c" style="width:${c}%"></div>
          </div>
          <div class="lb-comp-label">${s}% swordsman · ${a}% archer · ${c}% cavalry</div>
        </div>
      `;
    }

    function renderTactics(t) {
      const rows = [
        ['aggr', t.aggression, 'aggression'],
        ['def', t.defense, 'defense'],
        ['chrg', t.cavalryCharge, 'cavalryCharge'],
        ['kc', t.keepCapture, 'keepCapture'],
      ];
      return `<div class="lb-tactics">${rows.map(([k, v, full]) => {
        const p = Math.round(Number(v || 0) * 100);
        return `<div class="lb-tac" title="${full}: ${p}%">
          <span class="lb-tac-label">${k}</span>
          <span class="lb-tac-bar"><span class="fill" style="width:${p}%"></span></span>
          <span class="lb-tac-val">${p}</span>
        </div>`;
      }).join('')}</div>`;
    }

    function rankClass(i) { return i === 0 ? 'top1' : (i < 3 ? 'top3' : ''); }

    function renderRows(agents) {
      const tbody = $('#lb-tbody');
      if (!agents.length) {
        tbody.innerHTML = `<tr><td colspan="8"><div class="lb-empty">
          <div class="emoji">🥁</div>
          <div>No agents in this lineage yet.</div>
          <div style="margin-top:8px; font-size:12px;">Run a tournament: <code>node server/agent/run-tournament.js &lt;lineage&gt; 8 4</code></div>
        </div></td></tr>`;
        return;
      }
      tbody.innerHTML = agents.slice(0, 50).map((a, i) => `
        <tr class="lb-row" data-id="${a.id}">
          <td class="lb-rank ${rankClass(i)}">${i + 1}</td>
          <td class="lb-id">#${a.id}</td>
          <td><span class="lb-gen">G${a.generation || 1}</span></td>
          <td class="lb-fitness">${fmt(a.fitness, 0)}</td>
          <td class="lb-wld"><span class="w">${a.wins || 0}W</span> · <span class="l">${a.losses || 0}L</span> · <span class="d">${a.draws || 0}D</span></td>
          <td>${renderComposition(a.genome.composition)}</td>
          <td>${renderTactics(a.genome.tactics)}</td>
          <td><span class="lb-target">${a.genome.tactics.targetPriority || '—'}</span></td>
        </tr>
      `).join('');
      $$('.lb-row').forEach((tr) => {
        tr.addEventListener('click', () => openDetail(parseInt(tr.dataset.id, 10)));
      });
    }

    function renderStats(agents, lineageStats) {
      $('#stat-lineage').textContent = selected.lineage || 'All';
      $('#stat-count').textContent = agents.length;
      if (agents.length) {
        const avg = agents.reduce((s, a) => s + (a.fitness || 0), 0) / agents.length;
        const maxGen = Math.max(...agents.map(a => a.generation || 1));
        $('#stat-avg').textContent = fmt(avg, 0);
        $('#stat-gen').textContent = 'G' + maxGen;
      } else {
        $('#stat-avg').textContent = '—';
        $('#stat-gen').textContent = '—';
      }
    }

    // ------------- detail panel -------------
    async function openDetail(id) {
      $('#detail-panel').classList.add('open');
      $('#overlay').classList.add('open');
      $('#detail-body').innerHTML = '<div class="lb-loading">Loading</div>';
      try {
        const data = await fetchJSON('/api/agent/genome/' + id);
        const a = data.agent;
        const g = a.genome;
        const comp = g.composition;
        const tac = g.tactics;
        const train = g.training;
        $('#detail-body').innerHTML = `
          <h2>Commander #${a.id}</h2>
          <div class="meta">Lineage <strong>${a.lineage}</strong> · generation G${a.generation} · parent: ${a.parentAId ? 'id ' + a.parentAId : '—'}</div>

          <div class="lb-section">
            <h3>Record</h3>
            <div class="lb-kv"><span class="k">Elo fitness</span><span class="v">${fmt(a.fitness)}</span></div>
            <div class="lb-kv"><span class="k">Wins</span><span class="v">${a.wins}</span></div>
            <div class="lb-kv"><span class="k">Losses</span><span class="v">${a.losses}</span></div>
            <div class="lb-kv"><span class="k">Draws</span><span class="v">${a.draws}</span></div>
            <div class="lb-kv"><span class="k">Decisive wins</span><span class="v">${a.decisiveWins}</span></div>
            <div class="lb-kv"><span class="k">Avg rounds survived</span><span class="v">${fmt(a.avgRoundsSurvived, 1)}</span></div>
          </div>

          <div class="lb-section">
            <h3>Army composition</h3>
            <div class="lb-kv"><span class="k">Swordsman</span><span class="v">${pct(comp.swordsman)}%</span></div>
            <div class="lb-kv"><span class="k">Archer</span><span class="v">${pct(comp.archer)}%</span></div>
            <div class="lb-kv"><span class="k">Cavalry</span><span class="v">${pct(comp.cavalry)}%</span></div>
          </div>

          <div class="lb-section">
            <h3>Training</h3>
            <div class="lb-kv"><span class="k">+ swordsman</span><span class="v">+${train.swordsman}</span></div>
            <div class="lb-kv"><span class="k">+ archer</span><span class="v">+${train.archer}</span></div>
            <div class="lb-kv"><span class="k">+ cavalry</span><span class="v">+${train.cavalry}</span></div>
          </div>

          <div class="lb-section">
            <h3>Tactics</h3>
            <div class="lb-kv"><span class="k">Aggression</span><span class="v">${pct(tac.aggression)}%</span></div>
            <div class="lb-kv"><span class="k">Defense</span><span class="v">${pct(tac.defense)}%</span></div>
            <div class="lb-kv"><span class="k">Cavalry charge</span><span class="v">${pct(tac.cavalryCharge)}%</span></div>
            <div class="lb-kv"><span class="k">Focus fire</span><span class="v">${pct(tac.focusFire)}%</span></div>
            <div class="lb-kv"><span class="k">Ranged engage</span><span class="v">${pct(tac.rangedEngage)}%</span></div>
            <div class="lb-kv"><span class="k">Keep capture</span><span class="v">${pct(tac.keepCapture)}%</span></div>
            <div class="lb-kv"><span class="k">Target priority</span><span class="v">${tac.targetPriority}</span></div>
          </div>

          <div class="lb-section">
            <h3>Genome fingerprint</h3>
            <div class="lb-fp">${a.fingerprint}</div>
          </div>
        `;
      } catch (e) {
        $('#detail-body').innerHTML = `<div class="lb-empty"><div class="emoji">⚠️</div>Load failed: ${e.message}</div>`;
      }
    }

    function closeDetail() {
      $('#detail-panel').classList.remove('open');
      $('#overlay').classList.remove('open');
    }

    // ------------- main loop -------------
    async function load() {
      try {
        const agents = await loadPopulation(selected.lineage);
        renderRows(agents);
        renderStats(agents, null);
        const tick = new Date().toLocaleTimeString('en-US', { hour12: false });
        $('#last-tick').innerHTML = `<span class="lb-pulse"></span> Last update: ${tick} — every 10 seconds`;
      } catch (e) {
        $('#lb-tbody').innerHTML = `<tr><td colspan="8"><div class="lb-empty">
          <div class="emoji">⚠️</div>
          <div>Load error: ${e.message}</div>
          <div style="margin-top:8px; font-size:12px;">Is the server at <code>http://localhost:3000</code> unreachable?</div>
        </div></td></tr>`;
      }
    }

    // ------------- wire up -------------
    document.addEventListener('DOMContentLoaded', () => {
      $('#lineage-select').addEventListener('change', (e) => setLineage(e.target.value));
      $('#refresh-btn').addEventListener('click', load);
      $('#close-btn').addEventListener('click', closeDetail);
      $('#overlay').addEventListener('click', closeDetail);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

      loadLineages();
      load();
      setInterval(load, REFRESH_MS);
    });
  })();
  </script>
</body>
</html>
